# Herdr configuration -- unified navigation grammar (consistent with tmux + Hyprland + neovim).
#
# Concept mapping (tmux → herdr):
#   pane    → pane
#   window  → tab
#   session → workspace
#
#   Direction keys define the LEVEL:
#     hjkl  = View   (panes)
#     [/]   = Task   (tabs)
#
#   Modifiers define the ACTION (consistent across both levels):
#     bare  = Navigate
#     Shift = Resize     (view) / Move pane to tab (task)
#     Ctrl  = Swap       (view)
#
#   Additional:
#     arrows = Create    (spawn split in direction)
#     1-9    = Context   (indexed workspace jump)
#     Shift+1-9 = Agent  (indexed agent focus)
#
# Where Mod = Super (Hyprland) or Alt (tmux/herdr).
#
# ┌─ View (hjkl) ──────────────────────────────────────────────────────┐
# │  Alt + hjkl            navigate panes                              │
# │  Alt + Shift + hjkl    resize panes                                │
# │  Alt + Ctrl + hjkl     swap panes                                  │
# │  Alt + arrows          create split in direction (all 4)           │
# │  Alt + Shift + ← / →   move pane to prev/next tab                 │
# │  Alt + z               zoom pane (fullscreen)                      │
# │  Alt + q               close pane                                  │
# │  Alt + Ctrl + Enter    break pane to new tab                       │
# │  Alt+Ctrl+Shift+Enter  break pane to new workspace                 │
# └────────────────────────────────────────────────────────────────────┘
# ┌─ Task ([/]) ───────────────────────────────────────────────────────┐
# │  Alt + [ / ]           prev/next tab                               │
# │  Alt + Shift + [ / ]   move tab position                          │
# │  Alt + Enter           new tab                                     │
# │  Alt + n               rename tab                                  │
# └────────────────────────────────────────────────────────────────────┘
# ┌─ Context (workspace + agents) ───────────────────────────────────┐
# │  Alt + 1-9             switch to workspace N                       │
# │  Alt + Shift + 1-9     focus agent N                               │
# │  Alt + f               workspace picker                            │
# │  Alt + s               session navigator (goto)                    │
# │  Alt + Shift + n       rename workspace                            │
# │  Alt + Shift + Enter   new workspace                               │
# │  Alt + Tab             last pane (across workspaces/tabs)          │
# │  Alt + r               reload config                               │
# └────────────────────────────────────────────────────────────────────┘
# ┌─ Prefix (Alt+Space) ──────────────────────────────────────────────┐
# │  Space                 sessionizer (fzf project picker popup)      │
# │  alt+g                 lazygit popup                               │
# └────────────────────────────────────────────────────────────────────┘

onboarding = false

[theme]
name = "terminal"

[keys]
prefix = "alt+space"

# ── View level: pane (hjkl) ──

# Navigate panes: Alt + hjkl
focus_pane_left  = "alt+h"
focus_pane_down  = "alt+j"
focus_pane_up    = "alt+k"
focus_pane_right = "alt+l"

# Resize panes: Alt + Shift + hjkl
resize_pane_left  = "alt+shift+h"
resize_pane_down  = "alt+shift+j"
resize_pane_up    = "alt+shift+k"
resize_pane_right = "alt+shift+l"

# Create split in direction: Alt + arrows
split_horizontal = "alt+down"
split_vertical   = "alt+right"

# Zoom pane: Alt + z
zoom = "alt+z"

# Reload config: Alt + r
reload_config = "alt+r"

# Swap panes: Alt + Ctrl + hjkl
swap_pane_left  = "alt+ctrl+h"
swap_pane_down  = "alt+ctrl+j"
swap_pane_up    = "alt+ctrl+k"
swap_pane_right = "alt+ctrl+l"

# Close pane: Alt + q
close_pane = "alt+q"

# ── Task level: tab ([/]) ──

# Cycle tabs: Alt + [ / ]
previous_tab = "alt+["
next_tab     = "alt+]"

# Move tab position: Alt + Shift + [ / ]
move_tab_previous = "alt+shift+["
move_tab_next     = "alt+shift+]"

# New tab: Alt + Enter
new_tab = "alt+enter"

# ── Context: workspace (special) ──

# Switch workspace: Alt + 1-9
switch_workspace = "alt+1..9"

# Focus agent: Alt + Shift + 1-9
focus_agent = "alt+shift+1..9"

# Workspace picker: Alt + f
workspace_picker = "alt+f"

# Session navigator: Alt + s
goto = "alt+s"

# Rename tab: Alt + n
rename_tab = "alt+n"

# Rename workspace: Alt + Shift + n
rename_workspace = "alt+shift+n"

# New workspace: Alt + Shift + Enter
new_workspace = "alt+shift+enter"

# Last pane (across workspaces/tabs): Alt + Tab
last_pane = "alt+tab"

# ── Custom commands: split left/up (split + swap workaround) ──

# Split left: Alt + Left
[[keys.command]]
key = "alt+left"
type = "shell"
command = "herdr pane split $HERDR_ACTIVE_PANE_ID --direction right && sleep 0.05 && herdr pane swap --direction left"
description = "split left"

# Split up: Alt + Up
[[keys.command]]
key = "alt+up"
type = "shell"
command = "herdr pane split $HERDR_ACTIVE_PANE_ID --direction down && sleep 0.05 && herdr pane swap --direction up"
description = "split up"

# ── Custom commands: break/move pane (tmux join-pane / break-pane) ──

# Move pane to previous tab: Alt + Shift + { (Alt+Shift+[)
[[keys.command]]
key = "alt+shift+left"
type = "shell"
command = "TAB=$(herdr tab list --workspace $HERDR_ACTIVE_WORKSPACE_ID 2>/dev/null | jq -r '[.result.tabs[] | select(.workspace_id == env.HERDR_ACTIVE_WORKSPACE_ID)] | sort_by(.number) as $tabs | ($tabs | map(select(.tab_id == env.HERDR_ACTIVE_TAB_ID)) | .[0].number) as $n | ($tabs | map(select(.number < $n)) | last.tab_id) // empty') && [ -n \"$TAB\" ] && herdr pane move $HERDR_ACTIVE_PANE_ID --tab $TAB --split right --focus"
description = "move pane to previous tab"

# Move pane to next tab: Alt + Shift + } (Alt+Shift+])
[[keys.command]]
key = "alt+shift+right"
type = "shell"
command = "TAB=$(herdr tab list --workspace $HERDR_ACTIVE_WORKSPACE_ID 2>/dev/null | jq -r '[.result.tabs[] | select(.workspace_id == env.HERDR_ACTIVE_WORKSPACE_ID)] | sort_by(.number) as $tabs | ($tabs | map(select(.tab_id == env.HERDR_ACTIVE_TAB_ID)) | .[0].number) as $n | ($tabs | map(select(.number > $n)) | first.tab_id) // empty') && [ -n \"$TAB\" ] && herdr pane move $HERDR_ACTIVE_PANE_ID --tab $TAB --split right --focus"
description = "move pane to next tab"

# Break pane to new tab: Alt + Ctrl + Enter
[[keys.command]]
key = "alt+ctrl+enter"
type = "shell"
command = "herdr pane move $HERDR_ACTIVE_PANE_ID --new-tab --focus"
description = "break pane to new tab"

# Move pane to new workspace: Alt + Ctrl + Shift + Enter
[[keys.command]]
key = "alt+ctrl+shift+enter"
type = "shell"
command = "herdr pane move $HERDR_ACTIVE_PANE_ID --new-workspace --focus"
description = "break pane to new workspace"

# ── Prefix commands (Alt+Space, then key) ──

# Lazygit popup: prefix + alt+g
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "80%"
height = "80%"

# Sessionizer: prefix + Space
[[keys.command]]
key = "prefix+space"
type = "popup"
command = "kernix-sessionizer"
description = "sessionizer (project picker)"
width = "80%"
height = "80%"
