set -g set-clipboard on
set -g focus-events on
set-option -sa terminal-overrides ",xterm*:Tc,tmux*:Tc"

# Pass modified keys (Shift+Enter, Ctrl+Enter, ...) through to apps.
# Without this, tmux strips modifiers from Enter -- e.g. pi's Shift+Enter
# (newline) and Alt+Enter (queue follow-up) would submit the prompt instead.
set -g extended-keys on
set -g extended-keys-format csi-u

# Stay in tmux when a session is destroyed (sesh recommendation)
set -g detach-on-destroy off

# Pane borders
set -g pane-border-lines heavy
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour14"

# Pane/window base index
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ── View level: pane (hjkl) ──
# Navigate + resize: handled by smart-splits plugin (see plugins above)

# Swap panes (vim-aware): Alt + Ctrl + hjkl
# Not supported by smart-splits.tmux plugin, manual @pane-is-vim check.
bind -n M-C-h if -F "#{@pane-is-vim}" { send-keys M-C-h } { select-pane -L ; swap-pane -d -s ! }
bind -n M-C-j if -F "#{@pane-is-vim}" { send-keys M-C-j } { select-pane -D ; swap-pane -d -s ! }
bind -n M-C-k if -F "#{@pane-is-vim}" { send-keys M-C-k } { select-pane -U ; swap-pane -d -s ! }
bind -n M-C-l if -F "#{@pane-is-vim}" { send-keys M-C-l } { select-pane -R ; swap-pane -d -s ! }

# Resize panes: Alt + Shift + hjkl (smart-splits owns M-H/J/K/L)
# See the "Shift chords" note in default.nix: a Shift chord arrives as M-H
# (legacy), M-S-h (CSI-u, base codepoint) or M-S-H (CSI-u/MOK, shifted
# codepoint) depending on what the terminal negotiated. All three are bound
# and always forward the legacy spelling, since nvim maps <M-H>.
bind -n M-S-h if -F "#{@pane-is-vim}" { send-keys M-H } { resize-pane -L 3 }
bind -n M-S-H if -F "#{@pane-is-vim}" { send-keys M-H } { resize-pane -L 3 }
bind -n M-S-j if -F "#{@pane-is-vim}" { send-keys M-J } { resize-pane -D 3 }
bind -n M-S-J if -F "#{@pane-is-vim}" { send-keys M-J } { resize-pane -D 3 }
bind -n M-S-k if -F "#{@pane-is-vim}" { send-keys M-K } { resize-pane -U 3 }
bind -n M-S-K if -F "#{@pane-is-vim}" { send-keys M-K } { resize-pane -U 3 }
bind -n M-S-l if -F "#{@pane-is-vim}" { send-keys M-L } { resize-pane -R 3 }
bind -n M-S-L if -F "#{@pane-is-vim}" { send-keys M-L } { resize-pane -R 3 }

# Create split in direction: Alt + arrows
bind -n M-Left split-window -hb -c "#{pane_current_path}"
bind -n M-Down split-window -v -c "#{pane_current_path}"
bind -n M-Up split-window -vb -c "#{pane_current_path}"
bind -n M-Right split-window -h -c "#{pane_current_path}"

# Zoom pane: Alt + z
bind -n M-z resize-pane -Z

# Rotate layout: Alt + r
bind -n M-r next-layout

# Rename session: Alt + n (name)
bind -n M-n command-prompt -I "#S" { rename-session "%%" }

# New session in current path: Alt + Shift + n
bind -n M-N new-session -c "#{pane_current_path}"
bind -n M-S-n new-session -c "#{pane_current_path}"
bind -n M-S-N new-session -c "#{pane_current_path}"

# ── Task level: window ([/] + 1-9) ──

# Navigate windows: Alt + 1-9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Cycle windows: Alt + [ / ]
bind -n M-[ previous-window
bind -n M-] next-window

# Swap window position: Alt + Ctrl + [ / ] (Ctrl = swap)
bind -n M-C-[ swap-window -t -1\; select-window -t -1
bind -n M-C-] swap-window -t +1\; select-window -t +1

# Move pane to adjacent window: Alt + Shift + [ / ] (side-by-side join)
bind -n M-'{' join-pane -h -t :-1
bind -n M-S-[ join-pane -h -t :-1
bind -n M-S-{ join-pane -h -t :-1
bind -n M-'}' join-pane -h -t :+1
bind -n M-S-] join-pane -h -t :+1
bind -n M-S-'}' join-pane -h -t :+1

# Move pane to window N: Alt + Shift + 1-9 (legacy sends !@#$%^&*(), the
# base-codepoint encoding sends M-S-1..9, the shifted-codepoint one M-S-!..()
bind -n M-'!' join-pane -h -t :1
bind -n M-S-1 join-pane -h -t :1
bind -n M-S-! join-pane -h -t :1
bind -n M-'@' join-pane -h -t :2
bind -n M-S-2 join-pane -h -t :2
bind -n M-S-@ join-pane -h -t :2
bind -n M-'#' join-pane -h -t :3
bind -n M-S-3 join-pane -h -t :3
bind -n M-S-# join-pane -h -t :3
bind -n M-'$' join-pane -h -t :4
bind -n M-S-4 join-pane -h -t :4
bind -n M-S-$ join-pane -h -t :4
bind -n M-'%' join-pane -h -t :5
bind -n M-S-5 join-pane -h -t :5
bind -n M-S-% join-pane -h -t :5
bind -n M-'^' join-pane -h -t :6
bind -n M-S-6 join-pane -h -t :6
bind -n M-S-^ join-pane -h -t :6
bind -n M-'&' join-pane -h -t :7
bind -n M-S-7 join-pane -h -t :7
bind -n M-S-& join-pane -h -t :7
bind -n M-'*' join-pane -h -t :8
bind -n M-S-8 join-pane -h -t :8
bind -n M-S-* join-pane -h -t :8
bind -n M-'(' join-pane -h -t :9
bind -n M-S-9 join-pane -h -t :9
bind -n M-S-( join-pane -h -t :9

# Break pane to new window: Alt + Ctrl + Enter
bind -n M-C-Enter break-pane

# New window: Alt + Enter
bind -n M-Enter new-window -c "#{pane_current_path}"

# Kill pane: Alt + q (kills window if last pane)
bind -n M-q kill-pane

# ── Context: session (special) ──

# Session finder: Alt + f
bind -n M-f display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse --border --prompt='session: ' | xargs -r tmux switch-client -t"

# Session manager (sesh): Alt + s
# Full picker from the sesh README: live preview pane, source switching
# (^a all, ^t tmux, ^g configs, ^x zoxide, ^f find), ^d kills a session.
# run-shell (not display-popup): fzf-tmux opens its own popup; wrapping it
# in display-popup would nest popups and hang.
bind -n M-s run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Kill session: Alt + Shift + q (confirm; stays in tmux via detach-on-destroy off)
bind -n M-Q confirm-before -p "kill-session #S? (y/n)" kill-session
bind -n M-S-q confirm-before -p "kill-session #S? (y/n)" kill-session
bind -n M-S-Q confirm-before -p "kill-session #S? (y/n)" kill-session

# Last session: Alt + Tab
bind -n M-Tab switch-client -l

# ── Prefix commands (Alt + Space, then key) ──

# vi-mode copy
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
